name: Radar R3 periodic paper scanner
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  # Infra must use this same group for any other custom Pages deployment.
  group: radar-pages-site
  cancel-in-progress: false
jobs:
  scanner:
    # Keep cron disabled until manual proof, inbox receipt and hosted hash verified.
    if: github.event_name == 'workflow_dispatch' || vars.RADAR_CRON_ENABLED == 'true'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert main and public free-runner scope
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$IS_PRIVATE" = false
          test "$DEFAULT_BRANCH" = main
      - name: Install pinned read-only PDA dependency
        run: npm ci --prefix radar-r2 --ignore-scripts
      - name: Exact engine tests
        run: |
          node radar-r2/server/test.cjs
          node radar-r2/server/evidence-test.cjs
          node radar-r2/server/pool-test.cjs
          node radar-r2/server/wallet-test.cjs
          node radar-r2/server/native-test.cjs
          node radar-r2/server/ungated-test.cjs
      - name: Recover divergent deployed history once, preserving original IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 radar-r2/server/recover-20261014.py
      - name: Scan and persist paper events
        env:
          RADAR_HELIUS_API_KEY: ${{ secrets.RADAR_HELIUS_API_KEY }}
        run: node radar-r2/server/runner.cjs scan '${{ github.run_id }}'
      - name: Commit complete append-only paper ledger
        run: |
          git config user.name 'radar-paper-bot'
          git config user.email 'radar-paper-bot@users.noreply.github.com'
          git rm --cached --ignore-unmatch radar-r2/server-ledger.json
          git add radar-r2/server-ledger.json.gz radar-r2/recovery-20261014.json radar-r2/recovery-archive
          test "$(wc -c < radar-r2/server-ledger.json.gz)" -lt 90000000
          if ! git diff --cached --quiet; then
            git commit -m 'Radar paper scan [skip ci]'
            git fetch origin main
            # Never merge a stale ledger over a newer head. Serial workflow group owns scans.
            test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
            git push origin HEAD:main
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          fi
      - name: Stage entire existing public site
        if: success()
        run: |
          mkdir -p _public_site
          rsync -a ./ _public_site/ \
            --exclude='.git/' --exclude='.github/' --exclude='_public_site/' \
            --exclude='node_modules/' --exclude='server/' --exclude='*.log' \
            --exclude='*.pem' --exclude='.env*' --exclude='*TEST_OUTPUT*' \
            --exclude='*REPORT*' --exclude='LOCAL_*' --exclude='DASHBOARD_TEST_*' \
            --exclude='*.zip' --exclude='*.tmp' --exclude='recovery-archive/'
          test -f _public_site/radar-r2/index.html
          test -f _public_site/radar-r2/server-ledger.json
      - name: Upload complete site including post-scan ledger
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public_site
  deploy:
    if: needs.scanner.result == 'success'
    needs: scanner
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete same-link site
        id: deployment
        uses: actions/deploy-pages@v4
