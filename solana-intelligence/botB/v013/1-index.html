<style>

<script>
/* ===== CORE: pure logic (no DOM, no network). Unit-tested in node. ===== */
'use strict';
const STABLES=new Set(['So11111111111111111111111111111111111111112','EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v','Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB','USD1ttGY1N17NEEHLmELoaybftRBUSErhqYiQzvEmuB']);
const TARGETS=[2,3,4,5];
const DEFAULT_WEIGHTS={earlyness:18,liquidity:14,momentum:8,safety:20,holders:14,walletConf:10,independence:8};
const DEFAULTS={theme:'dark',minLiq:3000,minVol1h:0,maxAgeMin:120,sizeUsd:20,feePct:1,prioFeeSol:0.0005,autoSec:90,enrichPerScan:4,tradesPerScan:3,
  candidateScore:60,minConfidence:0.6,maxTop1Pct:30,sort:'score',filter:'all',weights:DEFAULT_WEIGHTS,
  alerts:{candidate:true,target:true,health:true,notify:false,sound:true,vibrate:true},autoPaper:false,trackHours:6,pages:1};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const num=x=>{const n=typeof x==='string'?parseFloat(x):x;return Number.isFinite(n)?n:null};
const median=a=>{const b=a.filter(x=>x!=null&&Number.isFinite(x)).sort((x,y)=>x-y);if(!b.length)return null;const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const short=a=>a?a.slice(0,4)+'..'+a.slice(-4):'';
const fmtNum=(x,d=3)=>{if(x==null||!Number.isFinite(x))return 'n/a';const a=Math.abs(x);if(a>=1e9)return (x/1e9).toFixed(2)+'B';if(a>=1e6)return (x/1e6).toFixed(2)+'M';if(a>=1e3)return (x/1e3).toFixed(1)+'K';if(a>=1)return x.toFixed(2);if(a===0)return '0';return x.toPrecision(d)};
const fmtUsd=x=>x==null||!Number.isFinite(x)?'n/a':'$'+fmtNum(x);
const fmtAgo=ms=>{if(ms==null)return 'n/a';const s=Math.max(0,ms/1000);if(s<90)return Math.round(s)+'s';if(s<5400)return Math.round(s/60)+'m';if(s<172800)return (s/3600).toFixed(1)+'h';return (s/86400).toFixed(1)+'d'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isMint=s=>typeof s==='string'&&/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(s);

/* ---- constant-product exit/entry cost model (quote reserve ~ liq/2) ---- */
function slipFrac(sizeUsd,liqUsd){if(!(liqUsd>0)||!(sizeUsd>=0))return null;const R=liqUsd/2;return sizeUsd/(R+sizeUsd)}
function roundTrip(sizeUsd,liqUsd,feePct,solUsd,prioSol){
  const s=slipFrac(sizeUsd,liqUsd);if(s==null)return null;
  const fee=feePct/100,prio=(solUsd>0&&prioSol>0)?(prioSol*solUsd)/Math.max(sizeUsd,1e-9):0;
  const buyKeep=(1-fee)*(1-s),sellKeep=(1-fee)*(1-s);
  return {slip:s,buyKeep,sellKeep,fixedFracPerLeg:prio,total:buyKeep*sellKeep*(1-2*prio)};
}
/* net multiple if price moves by m (gross multiple): value back / value in, after entry+exit costs */
function netMultiple(m,sizeUsd,liqUsd,feePct,solUsd,prioSol){
  const rt=roundTrip(sizeUsd,liqUsd,feePct,solUsd,prioSol);if(!rt)return null;
  const sellSlip=slipFrac(sizeUsd*m*rt.buyKeep,liqUsd);const fee=feePct/100;
  const out=sizeUsd*rt.buyKeep*m*(1-sellSlip)*(1-fee)-2*((solUsd>0?prioSol*solUsd:0));
  return out/sizeUsd;
}

/* ---- Gecko/Dex normalisation + dedupe ---- */
function normGeckoPool(p,src){
  const a=p.attributes||{},r=p.relationships||{};
  const bid=(((r.base_token||{}).data||{}).id||'').split('_')[1],qid=(((r.quote_token||{}).data||{}).id||'').split('_')[1];
  if(!isMint(bid)||STABLES.has(bid))return null;
  const created=Date.parse(a.pool_created_at||'');const tx=a.transactions||{};
  return {mint:bid,quote:qid,name:a.name||'',pool:a.address,dex:((r.dex||{}).data||{}).id||'',created:Number.isFinite(created)?created:null,
    price:num(a.base_token_price_usd),liq:num(a.reserve_in_usd),fdv:num(a.fdv_usd),vol5:num(((a.volume_usd||{}).m5)),vol1h:num(((a.volume_usd||{}).h1)),
    buys5:(tx.m5||{}).buys??null,sells5:(tx.m5||{}).sells??null,buyers5:(tx.m5||{}).buyers??null,sellers5:(tx.m5||{}).sellers??null,
    chg5:num((a.price_change_percentage||{}).m5),chg1h:num((a.price_change_percentage||{}).h1),src};
}
function normDexPair(q){
  if(!q||!q.baseToken||!isMint(q.baseToken.address))return null;
  const tx=q.txns||{};
  return {mint:q.baseToken.address,symbol:q.baseToken.symbol,name:q.baseToken.name,pair:q.pairAddress,url:q.url,dexId:q.dexId,price:num(q.priceUsd),
    liq:num((q.liquidity||{}).usd),fdv:num(q.fdv),mcap:num(q.marketCap),created:q.pairCreatedAt||null,
    buys5:(tx.m5||{}).buys??null,sells5:(tx.m5||{}).sells??null,buys1h:(tx.h1||{}).buys??null,sells1h:(tx.h1||{}).sells??null,
    vol5:num((q.volume||{}).m5),vol1h:num((q.volume||{}).h1),chg5:num((q.priceChange||{}).m5),chg1h:num((q.priceChange||{}).h1),
    boosts:(q.boosts||{}).active||0};
}
/* pick best (deepest liquidity) pair per mint; never drop a mint because liquidity fell */
function bestPairs(list){const best={};for(const q of list){const n=normDexPair(q);if(!n)continue;const b=best[n.mint];if(!b||(n.liq||0)>(b.liq||0))best[n.mint]=n}return best}

/* ---- scoring: missing data scores 0, never imputed; confidence reported separately (not added to the score) ---- */
function scoreToken(t,S){
  const W=Object.assign({},DEFAULT_WEIGHTS,S&&S.weights);const now=t.now||Date.now();const c={};const O='OBSERVED',N='NOT_OBSERVED';
  const ageMin=t.created?(now-t.created)/60000:null;
  c.earlyness=ageMin!=null&&ageMin>=0?{v:clamp(1-ageMin/Math.max(30,(S&&S.maxAgeMin)||120)),st:O,note:'pool age '+ageMin.toFixed(1)+'m'}:{v:0,st:N,note:'no creation time'};
  c.liquidity=t.liq>0?{v:clamp(Math.log10(t.liq/2000)/Math.log10(40)),st:O,note:fmtUsd(t.liq)}:{v:0,st:N,note:'no liquidity value'};
  const b=t.buys5,se=t.sells5;
  c.momentum=(b!=null&&se!=null&&b+se>=8)?{v:clamp(b/(b+se)*(se===0&&b>60?0.6:1)),st:O,note:b+' buys / '+se+' sells (5m)'}:{v:0,st:N,note:'fewer than 8 trades in 5m'};
  const r=t.risk;
  if(r&&r.sources&&r.sources.length){
    let sv=1;const notes=[];
    if(r.mintAuth===true){sv=0;notes.push('mint authority live')}else if(r.mintAuth===false)notes.push('mint authority renounced');
    if(r.freezeAuth===true){sv=0;notes.push('freeze authority live')}else if(r.freezeAuth===false)notes.push('freeze authority renounced');
    if(r.rugged){sv=0;notes.push('flagged rugged')}
    if(r.rugScore!=null){sv=Math.min(sv,clamp(1-r.rugScore/10));notes.push('rugcheck '+r.rugScore+'/10')}
    const known=(r.mintAuth!=null)+(r.freezeAuth!=null);
    c.safety=known===0&&r.rugScore==null?{v:0,st:N,note:'authorities unknown'}:{v:sv,st:O,note:notes.join(', ')};
  }else c.safety={v:0,st:N,note:'no risk data'};
  c.holders=(r&&r.top1!=null)?{v:clamp(1-r.top1/((S&&S.maxTop1Pct)||30)*0.8-(r.top10!=null?Math.max(0,r.top10-60)/200:0)),st:O,note:'top1 '+r.top1.toFixed(1)+'% top10 '+(r.top10!=null?r.top10.toFixed(1):'n/a')+'%'}:{v:0,st:N,note:'holders unknown'};
  const wc=t.walletConf;
  c.walletConf=(wc&&wc.n>=3)?{v:clamp(wc.distinctBuyers/Math.max(wc.n,1)*Math.min(1,wc.distinctBuyers/12)),st:O,note:wc.distinctBuyers+' distinct buyers in '+wc.n+' trades'}:{v:0,st:N,note:'trade sample too small'};
  const cl=t.cluster;
  c.independence=(cl&&cl.observed>=3)?{v:clamp(cl.independence),st:O,note:cl.funders+' funders for '+cl.observed+' wallets'+(cl.sameBlock?' ; same-block buys '+cl.sameBlock:'')}:{v:0,st:N,note:'funding not observed'};
  let tot=0,obsW=0,all=0;for(const k in W){all+=W[k];if(c[k]&&c[k].st===O){obsW+=W[k];tot+=W[k]*c[k].v}}
  return {score:all?Math.round(100*tot/all):0,confidence:all?+(obsW/all).toFixed(2):0,components:c,obsWeight:obsW,allWeight:all};
}
/* ---- early-entry decision with explicit rejection reasons ---- */
function decide(t,sc,S){
  const rej=[],inc=[];const now=t.now||Date.now();const ageMin=t.created?(now-t.created)/60000:null;
  if(!(t.price>0))rej.push('NO_PRICE');
  if(ageMin!=null&&ageMin>S.maxAgeMin)rej.push('AGE_OVER_'+S.maxAgeMin+'M');
  if(t.liq!=null&&t.liq<S.minLiq)rej.push('LIQ_UNDER_'+S.minLiq);
  if(S.minVol1h>0&&t.vol1h!=null&&t.vol1h<S.minVol1h)rej.push('VOL1H_UNDER_'+S.minVol1h);
  const r=t.risk||{};
  if(r.mintAuth===true)rej.push('MINT_AUTHORITY_LIVE');
  if(r.freezeAuth===true)rej.push('FREEZE_AUTHORITY_LIVE');
  if(r.rugged)rej.push('RUGGED_FLAG');
  if(r.top1!=null&&r.top1>S.maxTop1Pct)rej.push('TOP_HOLDER_OVER_'+S.maxTop1Pct+'PCT');
  if(t.dupOf)rej.push('DUPLICATE_SYMBOL_OF_'+short(t.dupOf));
  if(sc.components.safety.st!=='OBSERVED')inc.push('SAFETY_UNKNOWN');
  if(sc.components.holders.st!=='OBSERVED')inc.push('HOLDERS_UNKNOWN');
  if(sc.components.liquidity.st!=='OBSERVED')inc.push('LIQ_UNKNOWN');
  let verdict;
  if(rej.length)verdict='REJECTED';else if(inc.length&&(sc.components.safety.st!=='OBSERVED'||sc.confidence<S.minConfidence))verdict='INCOMPLETE';
  else if(sc.confidence<S.minConfidence)verdict='INCOMPLETE';else if(sc.score>=S.candidateScore)verdict='CANDIDATE';else verdict='WATCH';
  return {verdict,reasons:rej,missing:inc};
}
/* ---- outcome tracker: monotonic time, missing price never a win, losers retained, net-of-cost targets ---- */
function trackUpdate(rec,t,price,liqNow,S,solUsd){
  if(t<=(rec.lastT||0)) return {ok:false,why:'NON_MONOTONIC_TIME'};
  rec.polls=(rec.polls||0)+1;rec.lastT=t;
  if(!(price>0)){rec.miss=(rec.miss||0)+1;return {ok:true,missing:true}}
  (rec.ser=rec.ser||[]).push([t,price]);if(rec.ser.length>80)rec.ser.splice(1,rec.ser.length-80);
  if(!(rec.p0>0)){rec.p0=price;rec.liq0=liqNow;rec.max=1;rec.min=1;rec.last=1;return {ok:true,init:true}}
  if(rec.prevPx!=null&&price!==rec.prevPx)rec.pxChg=(rec.pxChg||0)+1;rec.prevPx=price;
  const m=price/rec.p0;
  /* v013: a price only counts toward max/hits while the pool still has real liquidity. A pair that drains to ~0 can print absurd multiples. */
  if(liqNow!=null&&rec.liq0>0&&liqNow<Math.max(1000,0.2*rec.liq0)){rec.liqBadPolls=(rec.liqBadPolls||0)+1;rec.last=m;rec.liqBad=true;return {ok:true,newHits:[],liqInvalid:true}}
  rec.liqBad=false;rec.max=Math.max(rec.max||1,m);rec.min=Math.min(rec.min==null?1:rec.min,m);rec.last=m;
  const nm=netMultiple(m,S.sizeUsd,rec.liq0||liqNow||0,S.feePct,solUsd||0,S.prioFeeSol);rec.netLast=nm;
  if(nm!=null)rec.netMax=Math.max(rec.netMax||0,nm);
  rec.hits=rec.hits||{};const age=(t-(rec.first||t))/60000;const newHits=[];
  for(const T of TARGETS){const k=T+'x';if(m>=T&&!rec.hits[k]){rec.hits[k]={t,min:+age.toFixed(1),net:nm!=null&&nm>=T};newHits.push(k)}
    else if(rec.hits[k]&&!rec.hits[k].net&&nm!=null&&nm>=T)rec.hits[k].net=true}
  for(const [lab,mins] of [['m10',10],['m60',60],['h6',360]])if(rec[lab]==null&&age>=mins)rec[lab]=m;
  return {ok:true,newHits};
}
/* ---- wallet quality: shrinkage, never rate small samples ---- */
function walletQuality(w){
  const n=w.outcomes?w.outcomes.length:0,wins=w.outcomes?w.outcomes.filter(x=>x.win).length:0;
  const shrunk=(wins+2)/(n+4);const flags=[];
  const a=w.rpc;
  if(a){if(a.ageDays!=null&&a.ageDays<1&&a.sigComplete)flags.push('FRESH_WALLET_UNDER_1D');if(a.count!=null&&a.count<5&&a.sigComplete)flags.push('FEW_TXS_'+a.count);
    if(a.failRate!=null&&a.failRate>0.4)flags.push('HIGH_FAIL_RATE');if(!a.sigComplete&&a.spanH!=null&&a.spanH<2)flags.push('HIGH_FREQUENCY_BOT_LIKE');if(a.balanceSol!=null&&a.balanceSol<0.02)flags.push('DUST_BALANCE')}
  if(w.sameBlock)flags.push('SAME_BLOCK_BUYER_'+w.sameBlock);
  const rated=n>=5;
  return {n,wins,shrunk:+shrunk.toFixed(3),rated,label:rated?(shrunk>=0.55?'OBSERVED_STRONG':shrunk>=0.4?'OBSERVED_MIXED':'OBSERVED_WEAK'):'INSUFFICIENT_SAMPLE ('+n+'/5 tracked outcomes)',flags,note:'Based only on tokens this browser tracked. Not historical on-chain skill.'};
}
/* ---- cluster logic ---- */
function groupBy(arr,f){const m={};for(const x of arr){const k=f(x);if(k==null)continue;(m[k]=m[k]||[]).push(x)}return m}
function clusterAnalysis(buyers,funders){
  // buyers: [{addr,block,t,usd}], funders: {addr: funderAddr|null}
  const obs=buyers.filter(b=>funders[b.addr]!==undefined);
  const known=obs.filter(b=>funders[b.addr]);
  const byF=groupBy(known,b=>funders[b.addr]);
  const groups=Object.entries(byF).filter(([f,a])=>a.length>=2).map(([f,a])=>({funder:f,wallets:a.map(x=>x.addr)}));
  const byB=groupBy(buyers.filter(b=>b.block!=null),b=>b.block);
  const sameBlockGroups=Object.entries(byB).filter(([b,a])=>new Set(a.map(x=>x.addr)).size>=3).map(([b,a])=>({block:b,wallets:[...new Set(a.map(x=>x.addr))]}));
  const sameBlock=sameBlockGroups.reduce((s,g)=>s+g.wallets.length,0);
  const distinctF=Object.keys(byF).length;
  return {observed:known.length,unknown:obs.length-known.length,total:buyers.length,funders:distinctF,independence:known.length?distinctF/known.length:null,groups,sameBlockGroups,sameBlock,
    note:'A shared funder may be an exchange. Independence is only measured over wallets whose first funding transfer was found.'};
}
/* first incoming SOL transfer to wallet in a parsed tx */
function findFunder(tx,wallet){
  if(!tx||!tx.transaction)return null;const ins=[...(tx.transaction.message.instructions||[])];
  for(const i of ((tx.meta||{}).innerInstructions||[]))ins.push(...(i.instructions||[]));
  for(const i of ins){if(!i||typeof i!=='object')continue;const p=i.parsed;if(p&&(p.type==='transfer'||p.type==='transferWithSeed')&&p.info&&p.info.destination===wallet&&i.program==='system'&&p.info.source!==wallet)return p.info.source}
  return null;
}
function inflowSource(tx,wallet){try{const keys=tx.transaction.message.accountKeys.map(k=>typeof k==='string'?k:k.pubkey);const i=keys.indexOf(wallet);if(i<0)return null;const d=tx.meta.postBalances.map((p,j)=>p-tx.meta.preBalances[j]);if(!(d[i]>0))return null;let b=-1,bv=0;d.forEach((v,j)=>{if(j!==i&&v<bv){bv=v;b=j}});return b<0?null:keys[b]}catch(e){return null}}
function preBalanceOf(tx,wallet){try{const keys=tx.transaction.message.accountKeys.map(k=>typeof k==='string'?k:k.pubkey);const i=keys.indexOf(wallet);return i<0?null:tx.meta.preBalances[i]}catch(e){return null}}
/* top holders with pool/curve accounts excluded */
function holderStats(largest,supplyRaw,owners,poolAddrs){
  const ex=[],keep=[];const ps=new Set((poolAddrs||[]).filter(Boolean));
  for(const a of largest){const own=owners[a.address];const amt=Number(a.amount);
    if(ps.has(a.address)||(own&&ps.has(own)))ex.push({addr:a.address,owner:own,amt,why:'POOL_OR_CURVE_ACCOUNT'});else keep.push({addr:a.address,owner:own,amt});}
  const exAmt=ex.reduce((s,x)=>s+x.amt,0);const circ=Math.max(Number(supplyRaw)-exAmt,0);
  if(!(circ>0))return {top1:null,top5:null,top10:null,excluded:ex,keep:[],circ};
  const pct=k=>keep.slice(0,k).reduce((s,x)=>s+x.amt,0)/circ*100;
  return {top1:keep.length?pct(1):null,top5:keep.length>=1?pct(5):null,top10:keep.length>=1?pct(10):null,excluded:ex,keep:keep.map(x=>({...x,pct:x.amt/circ*100})),circ,
    partial:largest.length<10};
}

async function rpc(method,params,cfg={}){

/* Replay: fetch 1-minute candles and simulate a paper entry with execution delay. Only candles AFTER the entry candle are used for outcomes. */
function replayCandles(candles,opt){
  // candles: [[ts_sec,o,h,l,c,v],...] oldest first
  const delay=Math.max(0,Math.round(opt.delayMin||0)),n=candles.length;if(n<delay+3)return {ok:false,why:'TOO_FEW_CANDLES ('+n+')'};
  const k0=delay;const entry=candles[k0][4];if(!(entry>0))return {ok:false,why:'NO_ENTRY_PRICE'};
  const rt=roundTrip(opt.sizeUsd,opt.liqUsd,opt.feePct,opt.solUsd||0,opt.prioFeeSol||0);if(!rt)return {ok:false,why:'NO_LIQUIDITY_FOR_COST_MODEL'};
  let max=1,min=1,maxNet=0;const hits={};const out={ok:true,entry,entryTs:candles[k0][0],n:n-k0-1,delay};
  for(let i=k0+1;i<n;i++){const c=candles[i];const hi=c[2]/entry,lo=c[3]/entry,cl=c[4]/entry;
    if(!(hi>0)||!(lo>0))continue;const fav=hi;max=Math.max(max,fav);min=Math.min(min,lo);
    const nm=netMultiple(cl,opt.sizeUsd,opt.liqUsd,opt.feePct,opt.solUsd||0,opt.prioFeeSol||0);if(nm!=null)maxNet=Math.max(maxNet,nm);
    for(const T of TARGETS){const k=T+'x';if(!hits[k]&&fav>=T){const net=netMultiple(T,opt.sizeUsd,opt.liqUsd,opt.feePct,opt.solUsd||0,opt.prioFeeSol||0);hits[k]={min:Math.round((c[0]-candles[k0][0])/60),net:net!=null&&net>=T}}}}
  const last=candles[n-1][4]/entry;out.max=max;out.min=min;out.last=last;out.maxNet=maxNet;out.hits=hits;out.lastNet=netMultiple(last,opt.sizeUsd,opt.liqUsd,opt.feePct,opt.solUsd||0,opt.prioFeeSol||0);
  out.warn='Candle highs are intrabar; a high does not prove a fill at that price. Net columns use closes.';return out;
}

  (function(){const r=storageReport();return '<div class="card"><h3>Storage inspector</h3><div class="mu" style="font-size:12px">Total '+Math.round(r.total/1024)+' KB of about '+r.limitKB+' KB allowed by the browser.</div><table>'+Object.entries(r.parts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>'<tr><td>'+k+'</td><td>'+Math.round(v/1024)+' KB</td></tr>').join('')+'</table></div>'})()+'<div class="card"><h3>Demo data</h3><div class="mu" style="font-size:12px">Toggle invented layout examples. They are labelled and never mixed with real tracking.</div><button data-act="demo">'+(S.demo?'Hide':'Show')+' DEMO DATA</button></div>'+
  '<div class="card"><h3>Reset</h3><button class="danger" data-act="reset">Clear all local data</button></div>';
}
function viewTests(){
  const t=S.tests;return '<div class="card"><h3>In-app self test</h3><div class="mu" style="font-size:12px">Runs logic checks on this device and live probes of each source. Results below are from the last run, nothing is pre-filled.</div><button class="pri" data-act="runtests">Run self test</button></div>'+(t?'<div class="card"><div class="mu">ran '+new Date(t.t).toLocaleString()+'</div>'+t.rows.map(r=>'<div style="padding:4px 0;border-bottom:1px solid var(--line)">'+chip(r.r,r.r==='PASS'?'ok':r.r==='FAIL'?'bad':'warn')+' '+esc(r.n)+(r.d?'<div class="mu" style="font-size:12px">'+esc(r.d)+'</div>':'')+'</div>').join('')+'</div>':'<div class="empty">Not run yet.</div>');
}
function viewAbout(){
  return guideHtml()+'<div class="card"><h3>What this is</h3><p>Independent Bot B build. Free public APIs only, no keys, no wallet, no trading. Everything runs in your browser.</p><h3>What needs more than a browser</h3><ul><li>Alerts while the page is closed (needs a backend or push service).</li><li>Wallet skill from history (needs indexed historical data, usually a paid or keyed API).</li><li>Fast RPC for large wallet and cluster scans (free public RPC is rate limited and some methods are refused).</li></ul><h3>Known limits</h3><ul><li>Weights are not backtested.</li><li>Cost model is an estimate, not an exchange fill.</li><li>RugCheck has no report for very new tokens; the app then reads authorities and holders from RPC when it can.</li></ul></div>';
}
/* ===== TOKEN DETAIL SHEET ===== */
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('on');$('#sbg').classList.add('on')}
function closeSheet(){sheetOpen=null;$('#sheet').classList.remove('on');$('#sbg').classList.remove('on')}
function detailHtml(mint){
  const t=S.tokens[mint];if(!t)return '<div class="empty">Token not found.</div>';const sc=t.sc,d=t.dec;const segs=['score','risk','holders','wallets','cluster','chart','replay','rules','cost'];
  let h='<div class="row between"><div><b style="font-size:17px">'+esc(t.symbol||t.name)+'</b> <span class="verdict v-'+d.verdict+'">'+d.verdict+'</span></div><button class="sm" data-act="close">Close</button></div><div class="mono mu">'+t.mint+'</div>';
  h+='<div class="seg" style="margin-top:8px">'+segs.map(s=>'<button data-act="stab" data-k="'+s+'" class="'+(sheetTab===s?'on':'')+'">'+s+'</button>').join('')+'</div>';
  if(sheetTab==='score'){h+='<div class="card"><div class="row between"><b>Score '+sc.score+'</b><span>confidence '+Math.round(sc.confidence*100)+'%</span></div><div class="mu" style="font-size:12px">Observed weight '+sc.obsWeight+' of '+sc.allWeight+'. Unobserved parts count 0.</div>'+Object.entries(sc.components).map(([k,c])=>'<div style="margin-top:6px"><div class="row between"><span>'+k+' <span class="mu">('+S.settings.weights[k]+')</span></span><span class="'+(c.st==='OBSERVED'?'':'warn')+'">'+(c.st==='OBSERVED'?Math.round(c.v*100)+'/100':'NOT OBSERVED')+'</span></div>'+meter(c.v,c.st)+'<div class="mu" style="font-size:12px">'+esc(c.note||'')+'</div></div>').join('')+'</div>';
    h+='<div class="card"><h3>Decision</h3>'+(d.reasons.length?'<div class="bad">Rejected: '+d.reasons.map(esc).join(', ')+'</div>':'<div class="ok">No hard rejection</div>')+(d.missing.length?'<div class="warn">Missing: '+d.missing.join(', ')+'</div>':'')+'<table><tr><td>First seen by me</td><td>'+new Date(t.first).toLocaleString()+' via '+esc(t.firstSrc||'?')+'</td></tr><tr><td>Pool created</td><td>'+(t.created?new Date(t.created).toLocaleString():'n/a')+'</td></tr><tr><td>Latency (created to first seen)</td><td>'+(t.created?fmtAgo(t.first-t.created):'n/a')+'</td></tr><tr><td>Source timestamps</td><td>'+Object.entries(t.srcT||{}).map(([k,v])=>k+' '+fmtAgo(Date.now()-v)+' ago').join(', ')+'</td></tr><tr><td>Source agreement (Gecko vs Dex)</td><td>'+(sourceAgreement(t)?(sourceAgreement(t).flag?'<span class="warn">DISAGREE '+(sourceAgreement(t).diff*100).toFixed(0)+'%</span>':'agree within '+(sourceAgreement(t).diff*100).toFixed(1)+'%'):'n/a')+'</td></tr><tr><td>Liquidity source</td><td>'+(t.liqVia||'dexscreener')+'</td></tr><tr><td>Price source time</td><td>'+(t.priceT?fmtAgo(Date.now()-t.priceT)+' ago'+(t.priceVia?' ('+t.priceVia+')':''):'n/a')+'</td></tr></table></div>'}
  if(sheetTab==='risk'){const r=t.risk;h+=r?'<div class="card"><h3>Risk checks</h3><div class="mu" style="font-size:12px">sources: '+r.sources.join(', ')+' · '+fmtAgo(Date.now()-r.t)+' ago</div><table><tr><td>Mint authority</td><td>'+(r.mintAuth==null?'UNKNOWN':r.mintAuth?'<span class="bad">LIVE</span>':'<span class="ok">renounced</span>')+'</td></tr><tr><td>Freeze authority</td><td>'+(r.freezeAuth==null?'UNKNOWN':r.freezeAuth?'<span class="bad">LIVE</span>':'<span class="ok">renounced</span>')+'</td></tr><tr><td>RugCheck score (0 best, 10 worst)</td><td>'+(r.rugScore??'n/a')+'</td></tr><tr><td>LP locked</td><td>'+(r.lpLocked??'n/a')+'</td></tr><tr><td>Insider networks</td><td>'+(r.insiders??'n/a')+'</td></tr></table>'+(r.rugRisks.length?'<div>'+r.rugRisks.map(x=>chip(x,'warn')).join('')+'</div>':'')+(r.notes.length?'<div class="mu" style="font-size:12px;margin-top:6px">'+r.notes.map(esc).join('<br>')+'</div>':'')+'</div>':'<div class="empty">No risk data yet.</div>';
    h+='<button class="pri" data-act="riskrun" data-m="'+t.mint+'">Run risk check now</button>'}
  if(sheetTab==='holders'){const r=t.risk;h+=r&&r.holdersKeep&&r.holdersKeep.length?'<div class="card"><h3>Top holders (pool/curve excluded)</h3><div class="mu" style="font-size:12px">top1 '+(r.top1!=null?r.top1.toFixed(1):'n/a')+'% · top5 '+(r.top5!=null?r.top5.toFixed(1):'n/a')+'% · top10 '+(r.top10!=null?r.top10.toFixed(1):'n/a')+'%</div><table>'+r.holdersKeep.map(x=>'<tr><td class="mono">'+short(x.o||x.a)+'</td><td>'+x.p+'%</td></tr>').join('')+'</table>'+(r.excluded.length?'<div class="mu" style="font-size:12px">Excluded '+r.excluded.length+' pool/curve account(s) from concentration.</div>':'')+'</div>':'<div class="empty">Holder data not available (free RPC refused or not fetched). Concentration stays UNKNOWN, never guessed.</div>'}
  if(sheetTab==='wallets'){const wc=t.walletConf;h+=wc?'<div class="card"><h3>Recent trade sample</h3><table><tr><td>Trades</td><td>'+wc.n+' (buys '+wc.buys+', sells '+wc.sells+')</td></tr><tr><td>Distinct buyers / sellers</td><td>'+wc.distinctBuyers+' / '+wc.distinctSellers+'</td></tr><tr><td>Same-block buyers</td><td>'+(t.sameBlock||0)+'</td></tr></table></div>'+(t.buyers||[]).slice(0,12).map(b=>'<div class="row between" style="padding:4px 0;border-bottom:1px solid var(--line)"><span class="mono">'+short(b.addr)+' '+fmtUsd(b.usd)+'</span><button class="sm" data-act="wl" data-a="'+b.addr+'">Profile</button></div>').join(''):'<div class="empty">No trade sample yet. '+(t.tradesErr?'Last error: '+esc(t.tradesErr):'It is fetched for top-ranked tokens during a scan.')+'</div>'}
  if(sheetTab==='cluster'){const c=t.cluster;h+='<div class="card"><h3>Smart-money cluster analysis</h3>'+(c?'<table><tr><td>Wallets sampled / funding found</td><td>'+c.sampled+' / '+c.observed+'</td></tr><tr><td>Distinct funders</td><td>'+c.funders+'</td></tr><tr><td>Independence (funders / wallets)</td><td>'+(c.independence!=null?(c.independence*100).toFixed(0)+'%':'not observed')+'</td></tr><tr><td>Same-block buy wallets</td><td>'+c.sameBlock+'</td></tr><tr><td>Why funding was/was not found</td><td>'+Object.entries(c.why||{}).map(([k,v])=>k+' x'+v).join(', ')+'</td></tr></table>'+c.groups.map(g=>'<div class="warn" style="font-size:12px">Common funder <span class="mono">'+short(g.funder)+'</span> funded '+g.wallets.length+' buyers</div>').join('')+'<div class="mu" style="font-size:12px">'+esc(c.note)+'</div>':'<div class="mu">Not run. It reads each early buyer\'s oldest transactions from free RPC (slow, rate limited), max 8 wallets.</div>')+'</div><button class="pri" id="btnCluster" data-act="cluster" data-m="'+t.mint+'">Analyze cluster</button><div id="clProg" class="mu"></div>'}
  if(sheetTab==='chart'){h+='<div class="card"><h3>Price chart (GeckoTerminal 5m candles)</h3><div id="chartBox" class="mu">'+(t.pool?'Press Load.':'No pool address.')+'</div></div>'+(t.pool?'<button data-act="chart" data-m="'+t.mint+'">Load chart</button>':'')}
  if(sheetTab==='replay'){const r=t.replay;h+='<div class="card"><h3>Historical replay (1-minute candles)</h3><div class="mu" style="font-size:12px">Simulates a paper entry '+(S.settings.replayDelayMin??1)+' min after the first candle (execution delay) with fees and slippage. Only later candles are used for outcomes.</div>'+(r?(r.ok?'<table><tr><td>Candles</td><td>'+r.candles+' (from '+new Date(r.firstCandle).toLocaleString()+')</td></tr><tr><td>Entry (close of delay candle)</td><td>'+fmtNum(r.entry)+'</td></tr><tr><td>Max favourable / adverse (intrabar)</td><td>'+r.max.toFixed(2)+'x / '+r.min.toFixed(2)+'x</td></tr><tr><td>Net multiple now</td><td>'+(r.lastNet!=null?r.lastNet.toFixed(2)+'x':'n/a')+'</td></tr><tr><td>Best net multiple (closes)</td><td>'+r.maxNet.toFixed(2)+'x</td></tr></table><div>'+TARGETS.map(T=>{const x=r.hits[T+'x'];return chip(T+'x '+(x?(x.net?'net ':'gross only ')+x.min+'m':'not hit'),x?(x.net?'ok':'warn'):'')}).join('')+'</div><div class="mu" style="font-size:12px">'+esc(r.warn)+' Replay covers only tokens that still have a listed pool (survivorship), so do not read it as a base rate.</div>':'<div class="bad">Replay failed: '+esc(r.why)+'</div>'):'<div class="mu">Not run.</div>')+'</div><button class="pri" data-act="replay" data-m="'+t.mint+'">Run replay</button><div id="rpOut" class="mu"></div>'}
  if(sheetTab==='rules'){const r=(S.rules||{})[t.mint]||{};h+='<div class="card"><h3>Alert rules for this token</h3><div class="mu" style="font-size:12px">Fires while this page is open and scanning. Multiples are vs the first price this browser saw ('+fmtNum(t.p0)+').</div><div class="field"><label>Alert when price reaches (x, e.g. 2)</label><input type="number" step="0.1" id="ruleUp" value="'+(r.up||'')+'"></div><div class="field"><label>Alert when price falls to (x, e.g. 0.5)</label><input type="number" step="0.05" id="ruleDn" value="'+(r.down||'')+'"></div><button class="pri" data-act="saverule" data-m="'+t.mint+'">Save rule (also adds to watchlist)</button></div>'}
  if(sheetTab==='cost'){const st=S.settings,sol=S.sol.price||0,rt=roundTrip(st.sizeUsd,t.liq,st.feePct,sol,st.prioFeeSol);h+='<div class="card"><h3>Execution cost estimate ($'+st.sizeUsd+')</h3>'+(rt?'<table><tr><td>Slippage per leg (pool depth)</td><td>'+(rt.slip*100).toFixed(2)+'%</td></tr><tr><td>Fee per leg</td><td>'+st.feePct+'%</td></tr><tr><td>Round trip keeps</td><td>'+(rt.total*100).toFixed(1)+'% of value</td></tr><tr><td>Price needed to break even</td><td>'+(1/rt.total).toFixed(2)+'x</td></tr><tr><td>Net value at 2x gross</td><td>'+(netMultiple(2,st.sizeUsd,t.liq,st.feePct,sol,st.prioFeeSol)||0).toFixed(2)+'x</td></tr></table>':'<div class="empty">Needs liquidity.</div>')+'<div class="mu" style="font-size:12px">Constant-product estimate. Real route may differ.</div></div><div class="row"><button data-act="quote" data-m="'+t.mint+'">Live Jupiter round-trip quote</button><button class="pri" data-act="paper" data-m="'+t.mint+'">Paper buy</button></div><div id="qOut" class="mu" style="margin-top:6px"></div>'}
  h+='<div class="row" style="margin-top:10px"><button class="sm" data-act="share" data-m="'+t.mint+'">Share summary</button>'+(t.url?'<a href="'+esc(t.url)+'" target="_blank" rel="noopener">Dexscreener</a>':'')+'<a href="https://rugcheck.xyz/tokens/'+t.mint+'" target="_blank" rel="noopener">RugCheck</a><a href="https://solscan.io/token/'+t.mint+'" target="_blank" rel="noopener">Solscan</a></div>';
  return h;
}
/* ===== RENDER + EVENTS ===== */
let autoTimer=null;
function render(){
  $('#tabs').innerHTML=TABS.map(([k,l,i])=>'<button data-act="tab" data-k="'+k+'" class="'+(tab===k?'on':'')+'" aria-label="'+l+'"><span class="ic">'+i+'</span>'+l+'</button>').join('');
  const v={radar:viewRadar,wallets:viewWallets,targets:viewTargets,ledger:viewLedger,more:viewMore}[tab];
  const y=window.scrollY;try{$('#view').innerHTML=v()}catch(e){$('#view').innerHTML='<div class="err">View error: '+esc(e.message)+'</div>';log('bad','render '+tab+': '+e.message)}
  const sf=$('#selSort');if(sf)sf.value=S.settings.sort;const ff=$('#selFilter');if(ff)ff.value=S.settings.filter;window.scrollTo(0,y);
  const fe=$('#fresh');if(fe&&!scanning)fe.innerHTML=S.lastScan?freshChip(S.lastScan,'scan',Math.max(S.settings.autoSec*3000,300000)):'never scanned';
  $('#btnScan').disabled=scanning;$('#btnScan').textContent=scanning?'Scanning...':'Scan';
  document.documentElement.setAttribute('data-theme',S.settings.theme);
  if(sheetOpen&&$('#sheet').classList.contains('on')){const sc=$('#sheet').scrollTop;$('#sheet').innerHTML='<div class="grab"></div>'+detailHtml(sheetOpen);$('#sheet').scrollTop=sc}
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csvOutcomes(){const rows=Object.values(S.tokens).filter(t=>t.p0>0).map(t=>({mint:t.mint,symbol:t.symbol||t.name,first_seen:new Date(t.first).toISOString(),pool_created:t.created?new Date(t.created).toISOString():'',verdict:t.dec&&t.dec.verdict,score:t.sc&&t.sc.score,confidence:t.sc&&t.sc.confidence,p0:t.p0,liq0:t.liq0,max:t.max,min:t.min,last:t.last,net_max:t.netMax,m10:t.m10,m60:t.m60,h6:t.h6,hit2x:t.hits&&t.hits['2x']?(t.hits['2x'].net?'net':'gross'):'no',hit3x:t.hits&&t.hits['3x']?(t.hits['3x'].net?'net':'gross'):'no',hit4x:t.hits&&t.hits['4x']?(t.hits['4x'].net?'net':'gross'):'no',hit5x:t.hits&&t.hits['5x']?(t.hits['5x'].net?'net':'gross'):'no',polls:t.polls,missing_polls:t.miss||0}));return toCsv(rows,['mint','symbol','first_seen','pool_created','verdict','score','confidence','p0','liq0','max','min','last','net_max','m10','m60','h6','hit2x','hit3x','hit4x','hit5x','polls','missing_polls'])}
function csvSignals(){const rows=Object.values(S.tokens).filter(t=>t.sigT).map(t=>({mint:t.mint,symbol:t.symbol||t.name,signal_time:new Date(t.sigT).toISOString(),ref_price:t.sigPx,score:t.sigScore,max:t.max,min:t.min,net_last:t.netLast,polls:t.polls}));return toCsv(rows,['mint','symbol','signal_time','ref_price','score','max','min','net_last','polls'])}
function csvLedger(){return toCsv(S.ledger.map(p=>({id:p.id,symbol:p.symbol,mint:p.mint,opened:new Date(p.t).toISOString(),px:p.px,eff:p.eff,size:p.sizeUsd,slip:p.slip,fee:p.feePct,status:p.status,out:p.out,pnl:p.pnl})),['id','symbol','mint','opened','px','eff','size','slip','fee','status','out','pnl'])}
function setAuto(on){clearInterval(autoTimer);autoTimer=null;if(on){const sec=Math.max(45,S.settings.autoSec);autoTimer=setInterval(()=>{if(!document.hidden||true)scan()},sec*1000);}}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b){if(ev.target.id==='sbg')closeSheet();return}
  const a=b.dataset.act,m=b.dataset.m;
  try{
  if(a==='tab'){tab=b.dataset.k;render();window.scrollTo(0,0)}
  else if(a==='more'){moreTab=b.dataset.k;render()}
  else if(a==='open'){sheetOpen=m;sheetTab='score';openSheet(detailHtml(m))}
  else if(a==='close')closeSheet();
  else if(a==='stab'){sheetTab=b.dataset.k;render()}
  else if(a==='watch'){S.watch[m]?delete S.watch[m]:S.watch[m]=Date.now();save();render()}
  else if(a==='riskrun'){b.disabled=true;b.textContent='Checking...';await enrichRisk(m,S.tokens[m]);const t=S.tokens[m];t.now=Date.now();t.sc=scoreToken(t,S.settings);t.dec=decide(t,t.sc,S.settings);save();render()}
  else if(a==='cluster'){b.disabled=true;const pr=$('#clProg');try{await analyzeCluster(m,(i,n)=>{if(pr)pr.textContent='Reading wallet '+i+' of '+n+' ...'});const t=S.tokens[m];t.now=Date.now();t.sc=scoreToken(t,S.settings);t.dec=decide(t,t.sc,S.settings);save();render()}catch(e){if(pr)pr.innerHTML='<span class="bad">'+esc(e.message)+'</span>';b.disabled=false}}
  else if(a==='chart'){const box=$('#chartBox');box.innerHTML='<span class="spin"></span>loading...';const t=S.tokens[m];const r=await API.geckoOhlcv(t.pool);
    if(r.ok&&r.data&&r.data.data){const L=r.data.data.attributes.ohlcv_list.slice().reverse();const closes=L.map(x=>x[4]);box.innerHTML=spark(closes)+'<div class="mu" style="font-size:12px">'+L.length+' candles, last '+fmtAgo(Date.now()-L[L.length-1][0]*1000)+' ago, range '+fmtNum(Math.min(...closes))+' to '+fmtNum(Math.max(...closes))+'</div>'}
    else if(t.ser&&t.ser.length>=3){const closes=t.ser.map(x=>x[1]);box.innerHTML='<span class="warn">Candle feed failed ('+esc(r.err||r.status)+'). Showing this app\'s own recorded polls instead, '+t.ser.length+' points, not candles.</span>'+spark(closes)+'<div class="mu" style="font-size:12px">first '+fmtAgo(Date.now()-t.ser[0][0])+' ago, range '+fmtNum(Math.min(...closes))+' to '+fmtNum(Math.max(...closes))+'</div>'}
    else box.innerHTML='<span class="bad">Chart failed: '+esc(r.err||r.status)+'. No local price history yet, scan a few times first.</span>'}
  else if(a==='paper'){try{const p=paperBuy(m,false);toast('Paper position opened at '+fmtNum(p.eff)+' (slip '+(p.slip*100).toFixed(1)+'%)','ok');render()}catch(e){toast(e.message,'bad')}}
  else if(a==='sell'){paperSell(b.dataset.id);render()}
  else if(a==='quote'){const out=$('#qOut');out.innerHTML='<span class="spin"></span>asking Jupiter...';const t=S.tokens[m];const sol=await ensureSol();if(!sol){out.innerHTML='<span class="bad">No SOL price</span>';return}
    const lam=Math.round(S.settings.sizeUsd/sol*1e9);const q1=await API.jupQuote(SOL_MINT,m,lam);if(!q1.ok||!q1.data||!q1.data.outAmount){out.innerHTML='<span class="warn">NOT_QUOTED ('+esc(q1.err||q1.status)+(q1.status===429?', rate limited':'')+'). No route or rate limit; nothing assumed.</span>';return}
    const q2=await API.jupQuote(m,SOL_MINT,q1.data.outAmount);if(!q2.ok||!q2.data||!q2.data.outAmount){out.innerHTML='<span class="warn">Buy quoted, sell NOT_QUOTED ('+esc(q2.err||q2.status)+'). Exit may be impossible.</span>';return}
    const back=Number(q2.data.outAmount)/lam;out.innerHTML='Round trip $'+S.settings.sizeUsd+' keeps <b class="'+(back>=0.9?'ok':'bad')+'">'+(back*100).toFixed(1)+'%</b> (buy impact '+esc(q1.data.priceImpactPct||'0')+'%, sell impact '+esc(q2.data.priceImpactPct||'0')+'%) at '+new Date().toLocaleTimeString()}
  else if(a==='rescan')scan(true);
  else if(a==='copytop'){const r=await shareText(topCandidatesText());toast('Top candidates '+r,'ok')}
  else if(a==='guide'){openSheet('<div class="row between"><b>Guide</b><button class="sm" data-act="close">Close</button></div>'+guideHtml())}
  else if(a==='share'){const r=await shareText(tokenSummary(S.tokens[m]));toast('Summary '+r,'ok')}
  else if(a==='outf'){outF=b.dataset.k;render()}
  else if(a==='replay'){b.disabled=true;const o=$('#rpOut');o.innerHTML='<span class="spin"></span>fetching candles...';try{await replayToken(m)}catch(e){S.tokens[m].replay={ok:false,why:e.message};}render()}
  else if(a==='saverule'){const up=parseFloat($('#ruleUp').value),dn=parseFloat($('#ruleDn').value);setRule(m,up,dn);S.watch[m]=S.watch[m]||Date.now();save();toast('Rule saved','ok');render()}
  else if(a==='wl'){tab='wallets';closeSheet();render();const o=$('#wOut');if(o)o.innerHTML=walletProfileHtml(b.dataset.a)}

/* ---- P&L: realised, unrealised and simulated are never added together ---- */
function pnlSplit(ledger,tokens){
  const r={realised:{n:0,sum:0,wins:0,losses:0,unpriced:0},unrealised:{n:0,sum:0,unpriced:0,cost:0},invested:0};
  for(const p of ledger||[]){
    if(p.status==='OPEN'){const tk=tokens[p.mint];r.unrealised.n++;r.unrealised.cost+=p.sizeUsd;
      if(tk&&tk.price>0){const v=ledgerValue(p,tk.price,tk.liq);r.unrealised.sum+=v.pnl}else r.unrealised.unpriced++}
    else{r.realised.n++;const x=Number.isFinite(p.pnl)?p.pnl:-p.sizeUsd;r.realised.sum+=x;if(x>0)r.realised.wins++;else r.realised.losses++;if(p.status==='CLOSED_UNPRICED')r.realised.unpriced++}
    r.invested+=p.sizeUsd}
  return r}
/* what-if: same cost model as the ledger, no market data involved, so it is labelled SIMULATED */
function whatIf(o){
  const sol=o.sol||0,prio=sol?o.prioFeeSol*sol:0;
  const sl0=slipFrac(o.size,o.liq),sl1=slipFrac(o.size*o.mult,o.liq);
  if(sl0==null||sl1==null)return {ok:false,why:'NEEDS_LIQUIDITY'};
  const eff=1*(1+sl0),usd=o.size*(1-o.feePct/100)-prio,qty=usd/eff;
  const gross=qty*o.mult,out=gross*(1-sl1)*(1-o.feePct/100)-prio;
  return {ok:true,entrySlip:sl0,exitSlip:sl1,out,pnl:out-o.size,netMultiple:out/o.size,costDrag:(o.size*o.mult-out)/(o.size*o.mult)}}
function plCard(){
  const p=pnlSplit(S.ledger,S.tokens);const f=n=>(n>=0?'+':'-')+'$'+Math.abs(n).toFixed(2);
  return '<div class="card"><h3>Paper P&amp;L <span class="chip warn">PAPER, no real money</span></h3><div class="pl3">'+
  '<div class="kpi"><b class="'+(p.realised.sum>=0?'ok':'bad')+'">'+f(p.realised.sum)+'</b><span>REALISED ('+p.realised.n+' closed, '+p.realised.wins+' wins, '+p.realised.losses+' losses)</span><small>closed paper trades, net of fee, slippage and priority fee'+(p.realised.unpriced?'; '+p.realised.unpriced+' closed with no price, booked as total loss':'')+'</small></div>'+
  '<div class="kpi"><b class="'+(p.unrealised.sum>=0?'ok':'bad')+'">'+f(p.unrealised.sum)+'</b><span>UNREALISED ('+p.unrealised.n+' open)</span><small>marked at the last price, after modelled exit slippage'+(p.unrealised.unpriced?'; '+p.unrealised.unpriced+' open with no live price, NOT counted':'')+'</small></div>'+
  '<div class="kpi"><b>see below</b><span>SIMULATED</span><small>only from the what-if form, never mixed into the two numbers above</small></div></div></div>'}
function whatIfCard(){
  const w=S.whatif||{size:50,liq:20000,mult:2};

function snapTake(label){

/* ===== v013 Gate preview (dry run), completeness badge, verdict change log, overlap graph ===== */
GATE_TEXT.VOL1H_UNDER='1h volume under your minimum (thin trading)';
function completeness(t){const c=(t&&t.sc&&t.sc.components)||{};const k=Object.keys(c);if(!k.length)return {n:0,of:0,pct:0,missing:[]};

/* dry run: how many tokens land in each verdict if a gate were different. Uses the same decide() as the live scan, nothing is saved. */
function gatePreview(tokens,settings,over){

let PREV={};

  (r.moved.length?'<div class="mu" style="font-size:12px;margin-top:4px">'+r.moved.length+' would change: '+r.moved.slice(0,8).map(x=>esc(x.sym)+' '+x.from+' to '+x.to).join(', ')+'. A looser gate lets more through, it does not make them safer.</div>':'<div class="mu" style="font-size:12px;margin-top:4px">No token would change.</div>')+'<div class="row"><button class="sm" data-act="gpreset">Reset preview</button></div></div>'}

const _viewHealth13=viewHealth;viewHealth=function(){return previewCard()+verdictLogCard()+_viewHealth13()};
/* verdict change log */
function verdictChanges(prev,tokens,now,log,max){const ch=[];
  for(const t of Object.values(tokens||{})){if(!t||!t.dec)continue;const v=t.dec.verdict,p=prev[t.mint];
    if(p&&p!==v)ch.push({t:now,mint:t.mint,sym:t.symbol||t.name||short(t.mint),from:p,to:v,why:(t.dec.reasons||[]).slice(0,2).join('+')});prev[t.mint]=v}
  const all=(log||[]).concat(ch);return {log:all.slice(-(max||80)),added:ch.length}}
const _scan13=scan;
scan=async function(manual){const before=S.scans;const r=await _scan13(manual);if(S.scans>before){const pv=S.vprev||(S.vprev={});const o=verdictChanges(pv,S.tokens,Date.now(),S.vlog,80);S.vlog=o.log;if(o.added)save()}return r};
function verdictLogCard(){const l=(S.vlog||[]).slice(-12).reverse();

/* overlap graph: wallets are dots, a line is a pair with evidence. Line weight follows the hint level, colour is not the only cue */
function overlapGraph(pairs,w,h){w=w||320;h=h||220;if(!pairs||!pairs.length)return '';
  const nodes=[];pairs.forEach(p=>{[p.a,p.b].forEach(a=>{if(!nodes.includes(a))nodes.push(a)})});const n=nodes.length;
  const pos={};nodes.forEach((a,i)=>{const ang=2*Math.PI*i/n-Math.PI/2;pos[a]=[w/2+Math.cos(ang)*(w/2-34),h/2+Math.sin(ang)*(h/2-24)]});
  const wd={WEAK_HINT:1,HINT:2.5,STRONGER_HINT:4};
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Wallet overlap graph with '+n+' wallets and '+pairs.length+' pairs">';
  pairs.forEach(p=>{const a=pos[p.a],b=pos[p.b];s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="currentColor" stroke-opacity="'+(p.sameFunder?'.9':'.45')+'" stroke-width="'+(wd[p.level]||1)+'"'+(p.sameFunder?'':' stroke-dasharray="4 3"')+'/>'});
  nodes.forEach(a=>{const q=pos[a];s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="5" fill="currentColor"/><text x="'+q[0].toFixed(1)+'" y="'+(q[1]-9).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+esc(a.slice(0,4))+'</text>'});
  return s+'</svg><div class="mu" style="font-size:11px">Thick line = stronger hint. Solid = same first funder, dashed = funder not shared or unknown. Not proof of one owner.</div>'}
const _overlapCard13=overlapCard;overlapCard=function(){const h=_overlapCard13();const r=overlapPairs(S.wallets,S.tokens);const g=overlapGraph(r.pairs.slice(0,8));return g?h.replace('<details',g+'<details'):h};
