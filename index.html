 const W=360,H=70,p=6,t0=d[0][0],t1=Math.max(cy.end||d[d.length-1][0],d[d.length-1][0]);const vs=d.map(x=>x[1]).concat([st]);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<2){const m=(hi+lo)/2;lo=m-1;hi=m+1}
